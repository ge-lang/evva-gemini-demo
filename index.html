<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>EVVA Gemini Demo</title>

  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #eee; text-align: center; padding: 20px; }
    textarea { width: 80%; padding: 10px; border-radius: 6px; border: none; font-size: 16px; margin-bottom: 10px; }
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 5px; }
    #genBtn { background: #0ff; color: #111; font-weight: bold; }
    #genBtn:hover { background: #00ffaa; }
    .tabs { margin-top: 15px; }
    .tabs button { background: #333; color: #eee; }
    .tabs button.active { background: #0ff; color: #111; }
    pre { text-align: left; background: #000; padding: 10px; border-radius: 10px; max-height: 400px; overflow: auto;
         box-shadow: 0 0 15px rgba(0,255,255,0.3); animation: glow 3s infinite alternate; }
    @keyframes glow {
      from { box-shadow: 0 0 15px rgba(0,255,255,0.3); }
      to { box-shadow: 0 0 30px rgba(0,255,255,0.8); }
    }
    iframe { width: 100%; height: 400px; border: none; background: white; border-radius: 6px; margin-top: 10px; }
    #extraButtons { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>⚡ EVVA Gemini Demo</h1>

  <textarea id="prompt" rows="3" placeholder="Напиши: сделай html карточку профиля"></textarea><br>
  <button id="genBtn">Generate</button>

  <div class="tabs">
    <button id="tabCode" class="active">Code</button>
    <button id="tabPreview">Preview</button>
  </div>

  <div id="codePanel">
    <pre><code id="result" class="language-html"></code></pre>
    <div id="extraButtons" style="display:none;">
      <button id="copyBtn">Copy Code</button>
      <button id="downloadBtn">Download .html</button>
    </div>
  </div>

  <div id="previewPanel" style="display:none;">
    <iframe id="previewFrame"></iframe>
  </div>

  <script>
    const result = document.getElementById("result");
    const previewFrame = document.getElementById("previewFrame");
    const codePanel = document.getElementById("codePanel");
    const previewPanel = document.getElementById("previewPanel");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const extraButtons = document.getElementById("extraButtons");

    document.getElementById("genBtn").addEventListener("click", async () => {
      const prompt = document.getElementById("prompt").value;
      result.textContent = "⏳ Генерация...";
      extraButtons.style.display = "none";

      try {
        const res = await fetch("/api/gemini", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        console.log("Gemini ответ:", data);

        const text = data.text || "❌ Нет ответа";
        result.textContent = text;
        hljs.highlightElement(result);
        extraButtons.style.display = "block";

        const iframeDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(text);
        iframeDoc.close();
      } catch (e) {
        result.textContent = "Ошибка: " + e.message;
      }
    });

    document.getElementById("tabCode").addEventListener("click", () => {
      codePanel.style.display = "block";
      previewPanel.style.display = "none";
      tabCode.classList.add("active");
      tabPreview.classList.remove("active");
    });

    document.getElementById("tabPreview").addEventListener("click", () => {
      codePanel.style.display = "none";
      previewPanel.style.display = "block";
      tabPreview.classList.add("active");
      tabCode.classList.remove("active");
    });

    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(result.textContent);
      copyBtn.textContent = "✅ Copied!";
      setTimeout(() => copyBtn.textContent = "Copy Code", 1500);
    });

    downloadBtn.addEventListener("click", () => {
      const blob = new Blob([result.textContent], { type: "text/html" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "evva-demo.html";
      link.click();
    });
  </script>
</body>
</html>
